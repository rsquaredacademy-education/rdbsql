name: Build & Deploy to GitHub Pages (docs/)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Typst ships no fonts and the bare runner has none either, so a stale
      # fontconfig cache fails the PDF with "font fallback list must not be
      # empty". fc-cache -f makes the resolver see what we just installed.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-linuxlibertine fonts-dejavu-core
          fc-cache -f

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"

      - name: Install R packages
        run: R -e 'install.packages(c("DBI", "RSQLite", "dbplyr", "knitr", "rmarkdown", "readr", "dplyr"), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")'
          # NOTE: duckdb omitted — the book's only duckdb chunk is eval=FALSE, and the
          # duckdb CRAN package compiles ~30+ min from source when no jammy binary exists.

      # Quarto is pinned, and so is Typst — but this book needs a NEWER Typst
      # than the house default of 0.11.0. Quarto 1.10's Typst template emits
      # `place(..., scope: "parent")`, and Typst 0.11 rejects that argument:
      #   error: unexpected argument: scope
      # which fails the whole PDF. Verified locally: 1.10.18 + 0.11.0 fails,
      # 1.10.18 + 0.13.1 succeeds. Do not downgrade Typst here without re-testing,
      # and do not downgrade Quarto either — 1.6.40 cannot resolve this book's
      # @sec-... cross-references ("cannot reference heading without numbering").
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          version: "0.13.1"

      - name: Render HTML
        run: quarto render --to html --output-dir /tmp/stage-html

      # Generated from the rendered pages. The hand-maintained sitemap this
      # replaces omitted cheatsheet.html, production.html and duckdb.html --
      # all three are live pages, they were simply missing from the sitemap.
      - name: Generate sitemap
        run: bash scripts/make-sitemap.sh /tmp/stage-html https://rdbsql.rsquaredacademy.com

      # Fatal, not advisory. These were previously `|| echo "PDF_FAILED=1"`,
      # which hid a genuinely broken PDF behind a green build for months.
      - name: Render PDF
        run: quarto render --to pdf --output-dir /tmp/stage-pdf

      - name: Render ePub
        run: quarto render --to epub --output-dir /tmp/stage-epub

      - name: Verify slugs rendered
        run: sh scripts/verify-slugs.sh /tmp/stage-html

      - name: Verify sitemap covers every page
        run: sh scripts/verify-sitemap.sh /tmp/stage-html /tmp/stage-html/sitemap.xml

      # This book has 5 @sec- cross-references in index.qmd and no other book
      # checked them, so a broken one shipped silently.
      - name: Verify no unresolved cross-references
        run: |
          if grep -r '??</strong>' /tmp/stage-html/*.html; then
            echo "FAIL: unresolved cross-references (??) found"; exit 1
          fi
          echo "OK: no unresolved cross-references"

      - name: Assemble docs
        run: |
          rm -rf docs && mkdir -p docs
          cp -r /tmp/stage-html/. docs/
          cp /tmp/stage-pdf/*.pdf docs/
          cp /tmp/stage-epub/*.epub docs/
          sh scripts/post-render.sh
          cp google02e424888b5e2def.html robots.txt _redirects 404.html docs/ 2>/dev/null || true
          rm -rf docs/docs
          test -f docs/sitemap.xml || { echo "sitemap.xml missing after assemble"; exit 1; }
          ls docs/

      # Downloads are advertised on the landing page; assert they really shipped.
      - name: Verify downloads are present
        run: |
          ls /tmp/stage-pdf/*.pdf || { echo "PDF MISSING"; exit 1; }
          ls /tmp/stage-epub/*.epub || { echo "EPUB MISSING"; exit 1; }

      - name: Verify redirects
        run: bash scripts/test-redirects.sh docs

      - name: Link check (advisory)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: "docs/**/*.html --root-dir docs --exclude 'mailto:*'"

      - name: Commit docs
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: rebuild site via ci"
          file_pattern: docs/
